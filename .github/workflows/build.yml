name: Build SafeKey

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Apply SafeKey 2D icon pack
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('SafeKey_2D_Icon_Pack.zip') as z:
              for item in z.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError('Unsafe archive path')
                  if item.filename.startswith(('web/', 'src-tauri/icons/', 'src-tauri/gen/android/')):
                      z.extract(item)
          PY

      - name: Normalize Tauri PNG icons to RGBA
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for path in Path('src-tauri/icons').glob('*.png'):
              with Image.open(path) as source:
                  source.convert('RGBA').save(path, format='PNG')
                  print(f'Converted {path} to RGBA')
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        run: cargo tauri build
        working-directory: src-tauri

      - name: Upload .exe installer
        uses: actions/upload-artifact@v4.6.2
        with:
          name: SafeKey-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload .msi installer
        uses: actions/upload-artifact@v4.6.2
        with:
          name: SafeKey-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Apply SafeKey 2D icon pack
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('SafeKey_2D_Icon_Pack.zip') as z:
              for item in z.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError('Unsafe archive path')
                  if item.filename.startswith(('web/', 'src-tauri/icons/', 'src-tauri/gen/android/')):
                      z.extract(item)
          PY

      - name: Normalize Tauri PNG icons to RGBA
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for path in Path('src-tauri/icons').glob('*.png'):
              with Image.open(path) as source:
                  source.convert('RGBA').save(path, format='PNG')
                  print(f'Converted {path} to RGBA')
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-rust-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        run: cargo tauri build
        working-directory: src-tauri

      - name: Upload .deb
        uses: actions/upload-artifact@v4.6.2
        with:
          name: SafeKey-Linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4.6.2
        with:
          name: SafeKey-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
