name: Build SafeKey Android APK
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/gen/android/**'
      - 'src-tauri/icons/**'
      - 'web/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          yes | sdkmanager --licenses >/dev/null || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Tauri CLI
        run: npm install
      - name: Build Android APK
        run: npm run tauri:android:apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeKey-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          tag="branding-${GITHUB_SHA:0:7}"
          gh release create "$tag" "$apk#SafeKey-Android.apk" \
            --title "SafeKey Android - 2D logo (${GITHUB_SHA:0:7})" \
            --notes "Automated Android APK build with updated SafeKey 2D branding. Check signing before installing over an existing version." \
            --prerelease --target "$GITHUB_SHA"
