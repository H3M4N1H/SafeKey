name: Build SafeKey Android APK
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'web/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          yes | sdkmanager --licenses >/dev/null || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: android-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install JS dependencies (provides the Tauri CLI)
        run: npm ci
      - name: Expose Tauri CLI to Gradle as cargo tauri
        run: |
          # The generated Android Gradle plugin shells out to `cargo tauri android android-studio-script`,
          # so the CLI must be available as a cargo subcommand. The npm package ships the same CLI, so
          # wrap it instead of compiling tauri-cli from source on every run.
          cat > "$HOME/.cargo/bin/cargo-tauri" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          # Cargo passes the subcommand name as the first argument; the Tauri CLI does not expect it.
          shift
          exec node "$GITHUB_WORKSPACE/node_modules/@tauri-apps/cli/tauri.js" "$@"
          EOF
          chmod +x "$HOME/.cargo/bin/cargo-tauri"
          cargo tauri --version
      - name: Ensure Gradle wrapper is executable
        run: chmod +x src-tauri/gen/android/gradlew
      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          set -o pipefail
          npm run tauri:android:apk -- --verbose 2>&1 | tee "$RUNNER_TEMP/safekey-android-build.log"
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SafeKey-Android-Build-Log
          path: ${{ runner.temp }}/safekey-android-build.log
          if-no-files-found: ignore
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeKey-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          tag="branding-${GITHUB_SHA:0:7}"
          gh release create "$tag" "$apk#SafeKey-Android.apk" \
            --title "SafeKey Android - 2D logo (${GITHUB_SHA:0:7})" \
            --notes "Automated Android APK build with updated SafeKey 2D branding. Check signing before installing over an existing version." \
            --prerelease --target "$GITHUB_SHA"
